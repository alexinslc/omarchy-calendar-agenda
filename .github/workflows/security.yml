name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-security:
    name: Static security checks
    needs: [python-tests, qml-model-tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check for forbidden capabilities
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE \
            --exclude-dir=.git \
            --exclude='security.yml' \
            --exclude='OnboardingService.qml' \
            '(shell\s*[:=]\s*true|eval\s*\(|exec\s*\(|__import__\s*\(|Qt\.create|Quickshell\.exec|Process\s*\{|system\s*\(|os\.system|os\.popen|requests\.|importlib\.)' \
            .; then
            echo "Forbidden capability pattern detected. Review explicitly before merging."
            exit 1
          fi
          if grep -nE \
            "(Quickshell\\.exec|execDetached|shell\\s*[:=]\\s*true|[\"'](ba)?sh[\"']|[\"']-c[\"']|https?://)" \
            OnboardingService.qml; then
            echo "Onboarding process bridge contains an unapproved capability."
            exit 1
          fi
          if grep -RInE --exclude-dir=.git --exclude='security.yml' 'http://' . \
            | grep -vE 'http://127\.0\.0\.1:'; then
            echo "Non-loopback HTTP endpoint detected."
            exit 1
          fi

      - name: Check for committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE \
            --exclude-dir=.git \
            --exclude='security.yml' \
            --exclude='oauth-client.json' \
            '(BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY|AIza[0-9A-Za-z_-]{20,}|[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com)' \
            .; then
            echo "Possible credential detected in source."
            exit 1
          fi
          if test -f oauth-client.json; then
            python3 - <<'PY'
          import json
          from pathlib import Path

          google = json.loads(Path("oauth-client.json").read_text())["google"]
          client_id = google.get("client_id", "")
          if not client_id.endswith(".apps.googleusercontent.com"):
              raise SystemExit("bundled OAuth client ID is invalid")
          if google.get("client_secret", ""):
              raise SystemExit("bundled desktop OAuth client must not contain a secret")
          PY
          fi

      - name: Enforce Python standard library only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import pathlib
          import sys
          import sysconfig

          stdlib = set(getattr(sys, "stdlib_module_names", ()))
          stdlib.add(pathlib.Path(sysconfig.get_paths()["stdlib"]).name)
          failures = []
          for path in pathlib.Path("sync").rglob("*.py"):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [alias.name.split(".", 1)[0] for alias in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.level == 0:
                      names = [node.module.split(".", 1)[0]]
                  else:
                      continue
                  for name in names:
                      if name not in stdlib:
                          failures.append(f"{path}: {name}")
          if failures:
              print("Non-standard Python import(s):")
              print("\n".join(failures))
              raise SystemExit(1)
          PY

      - name: Validate archive safety
        shell: bash
        run: |
          set -euo pipefail
          if find . -path './.git' -prune -o -type l -print | grep -q .; then
            echo "Symlinks are not allowed in the plugin repository."
            exit 1
          fi
          if find . -path './.git' -prune -o -type f -size +2M -print | grep -q .; then
            echo "Unexpectedly large tracked file detected."
            exit 1
          fi

  python-tests:
    name: Python sync tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run standard-library unit tests
        run: python3 -m unittest discover -s tests -v

  qml-model-tests:
    name: QML model tests
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install Quickshell
        run: pacman -Syu --noconfirm quickshell git

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run QML model checks
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output=$(timeout 6s env QT_QPA_PLATFORM=offscreen quickshell -p model_test.qml 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if grep -q "agenda model tests passed" <<<"$output"; then
            exit 0
          fi
          exit "$status"

      - name: Statically load QML components
        shell: bash
        run: |
          set -euo pipefail
          omarchy_source=$(mktemp -d)
          qml_imports=$(mktemp -d)
          git clone --quiet --depth 1 --branch v4.0.0 \
            https://github.com/basecamp/omarchy.git "$omarchy_source"
          test "$(git -C "$omarchy_source" rev-parse HEAD)" = \
            "f0020448ca87329199de7cb12f2015ebc4a3e5e7"
          mkdir -p "$qml_imports/qs"
          ln -s "$omarchy_source/shell/Commons" "$qml_imports/qs/Commons"
          ln -s "$omarchy_source/shell/Ui" "$qml_imports/qs/Ui"
          /usr/lib/qt6/bin/qmllint -I "$qml_imports" \
            AgendaBarWidget.qml AgendaPanel.qml OnboardingService.qml \
            OnboardingPanel.qml SettingsPanel.qml CompactToggle.qml
